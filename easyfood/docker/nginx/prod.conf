# Nginx de producción: solo escucha en el puerto 80 DEL CONTENEDOR; docker-compose.prod.yml lo publica en 127.0.0.1.
# El HTTPS lo pone el proxy del servidor (Nginx, Caddy…) que apunta a ese puerto.
server_tokens off;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8M;

    # La IP real del cliente la manda el proxy del servidor en X-Forwarded-For (Laravel la lee con TRUSTED_PROXIES).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types application/json text/css application/javascript;

    # Fotos de platillos y archivos de los tickets: salen del volumen «storage», solo lectura y SIN ejecutar nada.
    location ^~ /storage/ {
        alias /var/www/storage/app/public/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Solo index.php ejecuta código; cualquier otro .php es 404.
    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }
    location ~ \.php$ { return 404; }

    # Nada de archivos ocultos (.env, .git…), salvo .well-known.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
