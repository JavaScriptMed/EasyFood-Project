; Pocos procesos: el contenedor tiene un tope de memoria (docker-compose.prod.yml) y cada petición ocupa unos 30-60 MB.
[www]
pm = dynamic
pm.max_children = 6
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 60s
catch_workers_output = yes
decorate_workers_output = no
