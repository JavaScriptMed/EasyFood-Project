name: easylunch

services:
  # PHP-FPM: ejecuta Laravel, artisan y composer.
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    # Sin env_file: Laravel lee el .env que ya está dentro del volumen, y así los cambios (APP_KEY, etc.) se notan sin recrear el contenedor.
    depends_on:
      db:
        condition: service_healthy

  # Nginx: único servicio expuesto al navegador. Entrega /public y pasa los .php a PHP-FPM.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # PostgreSQL con PostGIS (mapas, coordenadas y distancias de rutas).
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-easylunch}
      POSTGRES_USER: ${DB_USERNAME:-easylunch}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en tu archivo .env}
      TZ: America/Mexico_City
    ports:
      # Solo en tu máquina, para conectarte con DBeaver, TablePlus, etc.
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
